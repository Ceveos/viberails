pre-commit:
  parallel: true
  commands:
    format:
      glob: "{packages,tests}/**/*.{ts,tsx,js}"
      run: npx biome format --write {staged_files}
      stage_fixed: true
    lint:
      glob: "{packages,tests}/**/*.{ts,tsx,js}"
      run: npx biome check --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: "{packages,tests}/**/*.{ts,tsx}"
      run: bash -c 'for p in packages/*/tsconfig.json; do pnpm exec tsc -p "$p" --noEmit || exit 1; done'
